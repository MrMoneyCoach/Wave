name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install (deterministic)
        run: npm ci

      - name: Typecheck renderer
        run: npx tsc --noEmit

      - name: Build renderer
        run: npx vite build

      - name: Typecheck Electron main
        run: npx tsc -p electron/tsconfig.json --noEmit

      - name: Typecheck MCP server
        run: npx tsc -p mcp-server/tsconfig.json --noEmit

      - name: Compile Electron & MCP
        run: |
          npx tsc -p electron/tsconfig.json
          npx tsc -p mcp-server/tsconfig.json

      - name: Smoke-test build artifacts
        run: |
          test -f dist/index.html || (echo "missing dist/index.html" && exit 1)
          test -f dist-electron/main.js || (echo "missing dist-electron/main.js" && exit 1)
          test -f dist-electron/preload.js || (echo "missing dist-electron/preload.js" && exit 1)
          test -f dist-mcp/index.js || (echo "missing dist-mcp/index.js" && exit 1)
          echo "All build artifacts present."

      - name: Sanity-check MCP server boots
        run: |
          # Start the server, send a ListTools request, verify it replies
          # with our expected tool names. Uses the stdio transport.
          node scripts/mcp-smoke.mjs

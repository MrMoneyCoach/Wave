name: Build Alfred

on:
  # Tag push → build + publish a GitHub Release.
  push:
    tags:
      - "v*"
  # Manual trigger from the Actions tab → build and upload as an artifact.
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install (deterministic)
        run: npm ci

      - name: Build & package
        env:
          # Skip code signing for personal builds — the app still runs,
          # you just right-click → Open the first time.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package

      - name: Upload Alfred DMG
        uses: actions/upload-artifact@v4
        with:
          name: Alfred-macOS
          path: release/*.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
          generate_release_notes: true

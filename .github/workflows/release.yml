name: Build Alfred

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install (deterministic)
        run: npm ci

      - name: Typecheck + build renderer
        run: |
          npx tsc --noEmit
          npx vite build

      - name: Compile Electron + MCP
        run: |
          npx tsc -p electron/tsconfig.json
          npx tsc -p mcp-server/tsconfig.json
          node scripts/write-mcp-pkg.mjs

      - name: Verify build artifacts
        run: |
          test -f dist/index.html
          test -f dist-electron/main.js
          test -f dist-mcp/index.js
          echo "OK"

      - name: Package with electron-builder
        env:
          # Unsigned personal build: tell electron-builder not to look for
          # a code-signing identity in the keychain, and never attempt to
          # publish (no token is provided on a dispatch run).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # More verbose output if it fails — we want to see why.
          DEBUG: "electron-builder"
        run: npx electron-builder --mac --publish never

      - name: List produced DMGs
        run: ls -la release/

      - name: Upload Alfred DMG
        uses: actions/upload-artifact@v4
        with:
          name: Alfred-macOS
          path: release/*.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
          generate_release_notes: true

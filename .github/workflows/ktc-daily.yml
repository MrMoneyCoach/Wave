name: KTC daily snapshot

on:
  schedule:
    # 06:00 UTC daily — that's after KTC's overnight rank refresh.
    - cron: '0 6 * * *'
  workflow_dispatch: {}  # let us run it on demand
  push:
    paths:
      - 'sleeperleague/scripts/ktc_export.py'
      - '.github/workflows/ktc-daily.yml'

permissions:
  contents: write  # need this to commit results back

concurrency:
  group: ktc-daily
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Default branch — wherever the workflow lives.
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet requests

      - name: Run KTC export
        run: python sleeperleague/scripts/ktc_export.py

      - name: Commit + push snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sleeperleague/data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "KTC: daily values snapshot ($(date -u +%F))"
          git push

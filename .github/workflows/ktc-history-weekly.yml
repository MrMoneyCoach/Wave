# KTC weekly history — DISABLED
#
# KTC renders per-player history as a JavaScript chart whose data comes
# from hover events; it can't be extracted from the page source with a
# regex. Pulling it would require Selenium with simulated mouse-overs,
# which is slow (~10s per player × ~600 players > 60 min timeout) and
# fragile (any KTC UI change breaks it).
#
# The browser-side plumbing for "value at trade date" still works — it
# walks back through dated daily snapshots in sleeperleague/data/snapshots/.
# So as the daily workflow keeps committing new snapshots, value-at-trade
# will start showing up automatically for trades made after we started
# snapshotting.
#
# To re-enable a Selenium-based scraper for the top-N dynasty assets,
# uncomment the schedule below and put the Selenium implementation in
# sleeperleague/scripts/ktc_history.py.

name: KTC weekly history (disabled)

on:
  workflow_dispatch: {}  # leave manual trigger only; remove cron+push

permissions:
  contents: write

concurrency:
  group: ktc-history
  cancel-in-progress: false

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "This workflow is intentionally disabled. See the comment block"
          echo "at the top of this file for the reason and the path to re-enable."

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HouseholdMap — Visual Financial Map</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- Top bar -->
      <header class="topbar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="14" fill="url(#g)"></circle>
            <path d="M9 17l5-7 4 5 5-3v8H9z" fill="#fff" opacity=".95"></path>
            <defs>
              <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0" stop-color="#2bbfa6" />
                <stop offset="1" stop-color="#1f7ad6" />
              </linearGradient>
            </defs>
          </svg>
          <span>HouseholdMap</span>
        </div>

        <nav class="tabs" role="tablist">
          <button class="tab active" data-view="map" role="tab">Map</button>
          <button class="tab" data-view="list" role="tab">List</button>
          <button class="tab" data-view="reports" role="tab">Reports</button>
          <button class="tab" data-view="cashflow" role="tab">Cash Flow</button>
          <button class="tab" data-view="plan" role="tab">Plan</button>
          <button class="tab" data-view="settings" role="tab">Settings</button>
        </nav>

        <div class="topbar-actions">
          <input id="household-name" class="household-name" type="text" aria-label="Household name" />
          <button id="btn-sample" class="btn ghost" title="Load sample household">Sample</button>
          <button id="btn-export" class="btn ghost" title="Export JSON">Export</button>
          <button id="btn-import" class="btn ghost" title="Import JSON">Import</button>
          <button id="btn-print" class="btn ghost" title="Print / PDF">Print</button>
          <button id="btn-reset" class="btn danger-ghost" title="Clear all data">Reset</button>
          <input id="file-import" type="file" accept="application/json" hidden />
        </div>
      </header>

      <!-- Stats -->
      <section class="stats" id="stats"></section>

      <!-- Main content -->
      <main class="main">
        <!-- MAP VIEW -->
        <section id="view-map" class="view active">
          <div class="map-toolbar">
            <div class="map-toolbar-left">
              <button class="btn primary" id="btn-add-person">+ Person</button>
              <button class="btn primary" id="btn-add-asset">+ Asset</button>
              <button class="btn primary" id="btn-add-liability">+ Liability</button>
              <button class="btn primary" id="btn-add-insurance">+ Insurance</button>
              <button class="btn primary" id="btn-add-cashflow">+ Cash Flow</button>
            </div>
            <div class="map-toolbar-right">
              <button class="btn ghost" id="btn-zoom-out" aria-label="Zoom out">−</button>
              <button class="btn ghost" id="btn-zoom-reset" aria-label="Reset view">Fit</button>
              <button class="btn ghost" id="btn-zoom-in" aria-label="Zoom in">+</button>
            </div>
          </div>
          <div class="map-wrap" id="map-wrap">
            <svg id="map-svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Household financial map"></svg>
            <div class="legend">
              <div><span class="dot dot-asset"></span>Assets</div>
              <div><span class="dot dot-liability"></span>Liabilities</div>
              <div><span class="dot dot-insurance"></span>Insurance</div>
              <div><span class="dot dot-cashflow"></span>Cash Flow</div>
            </div>
          </div>
        </section>

        <!-- LIST VIEW -->
        <section id="view-list" class="view">
          <div id="list-content"></div>
        </section>

        <!-- REPORTS VIEW -->
        <section id="view-reports" class="view">
          <div id="reports-content"></div>
        </section>

        <!-- CASH FLOW VIEW -->
        <section id="view-cashflow" class="view">
          <div id="cashflow-content"></div>
        </section>

        <!-- PLAN VIEW -->
        <section id="view-plan" class="view">
          <div id="plan-content"></div>
        </section>

        <!-- SETTINGS VIEW -->
        <section id="view-settings" class="view">
          <div id="settings-content"></div>
        </section>
      </main>

      <!-- Side drawer for forms -->
      <aside id="drawer" class="drawer" aria-hidden="true">
        <div class="drawer-header">
          <h2 id="drawer-title">Add Item</h2>
          <button id="drawer-close" class="icon-btn" aria-label="Close">&times;</button>
        </div>
        <div id="drawer-body" class="drawer-body"></div>
      </aside>
      <div id="drawer-scrim" class="drawer-scrim"></div>
    </div>

    <footer class="footer">
      <small>HouseholdMap — a visual household financial map. Data stored locally in your browser.</small>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
